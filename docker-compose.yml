services:
  postgres:
    image: postgres:16-alpine
    container_name: pg_copilot_sandbox
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: perf_sandbox
    command: postgres -c track_counts=on -c autovacuum=off
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

